# FinTrack Backend Application Configuration
#
# SECURITY NOTE:
# This file uses environment variables for sensitive data.
# Actual secrets are stored in:
# - Local development: .env file (not committed to Git)
# - Production: Railway/Render environment variables
#
# Format: ${ENV_VAR_NAME:default_value}
# - Reads from environment variable if available
# - Falls back to default value if not set

# Application Name
spring.application.name=fintrack-backend

# Server Configuration
# Railway/Render will set PORT automatically, defaults to 8080 locally
server.port=${PORT:8080}

# Database Configuration
# Local: Uses .env file
# Production: Set these in Railway/Render dashboard
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/fintrack_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT Configuration
# IMPORTANT: Change these in production!
jwt.secret=${JWT_SECRET:CHANGE_THIS_IN_PRODUCTION_MINIMUM_256_BITS}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Logging Configuration
# DEBUG for local, INFO for production
logging.level.com.fintrack=${LOG_LEVEL:DEBUG}
logging.level.org.springframework.security=${SECURITY_LOG_LEVEL:DEBUG}